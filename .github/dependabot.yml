# Keeps the GitHub Actions used in .github/workflows up to date.
# Actions that follow a branch on purpose (hacs/action@main, hassfest@master) are not touched.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3
